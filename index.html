<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <main class="container">
        <h1>Tracker</h1>

        <p>
            Share your current location with this tracking application.
            Your location, IP address and browser information will be
            saved when you approve and submit it.
        </p>

        <button id="shareButton">Share My Location</button>

        <p id="status" role="status" aria-live="polite">
            Waiting for your permission.
        </p>

        <a id="mapLink" href="#" target="_blank" rel="noopener" hidden>
            View submitted location on Google Maps
        </a>
    </main>

    <script src="/script.js"></script>
</body>
</html>
